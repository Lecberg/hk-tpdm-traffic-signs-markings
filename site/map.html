<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HK Traffic Signs Map — TPDM Signs at Their Real Locations</title>
<meta name="description" content="Interactive map of Hong Kong traffic signs at their surveyed locations, from the Transport Department's Digitized Traffic Aids Drawings open data.">
<link rel="stylesheet" href="assets/vendor/leaflet.css">
<link rel="stylesheet" href="assets/style.css?v=11">
<link rel="stylesheet" href="assets/map.css?v=11">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<!-- Blocking on purpose: applies the stored theme before the first paint. -->
<script src="assets/theme.js?v=11"></script>
</head>
<body class="map-page">
<header class="site-header map-header">
  <div class="header-inner">
    <div class="brand">
      <a href="index.html" class="home-link" title="Back to sign library">
        <img src="assets/icon.svg" alt="" class="logo" width="40" height="40">
      </a>
      <div>
        <h1>HK Traffic Signs Map</h1>
        <div class="subtitle-wrap">
          <div><p class="subtitle">Every surveyed traffic sign in Hong Kong — zoom in to explore</p></div>
        </div>
      </div>
    </div>
    <div class="controls">
      <input id="filter" type="search" placeholder="Filter by code, e.g. 115…" autocomplete="off" aria-label="Filter signs by code">
      <a class="nav-btn icon-grid" href="index.html">Sign library</a>
      <button id="theme-toggle" class="icon-btn" type="button" aria-pressed="false" aria-label="Switch to dark theme" title="Switch to dark theme">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>
    <p id="status" class="count" aria-live="polite"></p>
  </div>
</header>

<div id="map" role="application" aria-label="Map of Hong Kong traffic signs"></div>

<script src="assets/vendor/leaflet.js"></script>
<script src="assets/map.js?v=11"></script>
</body>
</html>
