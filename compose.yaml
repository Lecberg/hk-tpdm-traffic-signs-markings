services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:8517:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/runtime-config.json"]
      interval: 15s
      timeout: 3s
      retries: 3
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      AI_GATEWAY_MODEL: ${AI_GATEWAY_MODEL:-}
      CUSTOM_API_BASE_URL: ${CUSTOM_API_BASE_URL:-}
      CUSTOM_API_KEY: ${CUSTOM_API_KEY:-}
      CUSTOM_MODEL: ${CUSTOM_MODEL:-}
      XDG_CACHE_HOME: /tmp/cache
      SVG_CAD_SITE: /app/site
      SVG_CAD_DATA: /app/data
      SVG_CAD_TEMP: /tmp
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=128m,nosuid
    pids_limit: 64
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
